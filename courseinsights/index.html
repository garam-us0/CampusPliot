<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campuspilot — Course Insights</title>
<link rel="stylesheet" href="../shared/styles.css">
<link rel="stylesheet" href="courseinsights.css">
</head>
<body>

<div class="page" id="page-courseinsights">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><polygon points="21,3.5 3,12.5 10.8,13.2" fill="#D42A2A"/><polygon points="21,3.5 10.8,13.2 13.5,21" fill="#7A0000"/></svg></div>
      <div class="topbar-name">Campuspilot</div>
      <div class="topbar-sub"><span>THE UNIVERSITY OF UTAH</span></div>
    </div>
    <div class="topbar-right">
      <div class="topbar-avatar">G</div><span class="topbar-username">Garam (u1621896)</span>
      <a class="topbar-logout" href="../login/index.html" onclick="logout();return false;">Logout</a>
    </div>
  </div>
  <div class="breadcrumb-bar">
    <div class="breadcrumb-left">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2 9l10 5 10-5-10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
      Student Portal &nbsp;›&nbsp; <b>Course Insights</b>
    </div>
    <div class="breadcrumb-right">Fall Semester 2026</div>
  </div>

  <div class="app-shell">
    <aside class="nav-rail" id="navrail"></aside>

    <main class="main-col">
      <div class="feature-head">
        <div class="feature-head-icon" style="background:var(--gold-tint);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB81D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2 9l10 5 10-5-10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
        </div>
        <div>
          <h1>Course Insights</h1>
          <div class="fh-sub" id="fhSub">Course evaluations, syllabus previews, and ratings</div>
        </div>
      </div>

      <div class="ci-toolbar">
        <div class="ci-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>
          <input type="text" id="ciSearch" placeholder="Search by course code, name, or instructor…" oninput="ciRender()">
        </div>
      </div>
      <div class="ci-filters" id="ciDeptFilters"></div>

      <div id="ciList"></div>
    </main>
  </div>
</div>

<!-- course detail modal -->
<div class="modal-overlay hidden" id="detail-modal" onclick="if(event.target===this)ciCloseDetail()">
  <div class="modal-card">
    <div class="modal-detail">
      <button class="modal-close" onclick="ciCloseDetail()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8290" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6l-12 12"/></svg></button>
      <h2 id="detailTitle">Course name</h2>
      <div class="ci-modal-sub" id="detailSub">Instructor</div>

      <div class="ci-stat-row">
        <div class="ci-stat"><div class="ci-stat-val" id="statRating">4.5 ★</div><div class="ci-stat-label">Avg Rating</div></div>
        <div class="ci-stat"><div class="ci-stat-val" id="statDiff">Medium</div><div class="ci-stat-label">Difficulty</div></div>
        <div class="ci-stat"><div class="ci-stat-val" id="statWorkload">6 hrs</div><div class="ci-stat-label">Weekly Workload</div></div>
      </div>

      <button class="ci-syllabus-btn" onclick="showToast('Syllabus preview is a placeholder in this prototype.')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
        Preview Syllabus
      </button>

      <div class="ci-reviews-head">
        <h3 id="reviewsCount">Reviews (0)</h3>
        <button class="ci-write-btn" id="writeBtn" onclick="ciToggleWriteForm()">Write a Review</button>
      </div>

      <div class="ci-write-form" id="writeForm">
        <div class="ci-star-pick" id="starPick"></div>
        <textarea id="reviewText" placeholder="What should other students know about this course?"></textarea>
        <button class="btn btn-red" onclick="ciSubmitReview()">Post Review</button>
      </div>

      <div id="reviewList"></div>
    </div>
  </div>
</div>

<div id="toast-host"></div>
<div id="toast-host"></div>
<script src="../shared/session.js"></script>
<script src="../shared/store.js"></script>
<script src="../shared/toast.js"></script>
<script src="../shared/nav.js"></script>
<script src="courseinsights.js"></script>
<script>
  var SESSION = requireSession();
  mountNavRail('navrail', 'courseinsights');
  if(SESSION){ isAdmin = (SESSION.role === 'admin'); ciApplyAdmin(); }
</script>
</body>
</html>
